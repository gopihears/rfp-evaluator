[project]
name = "rfp-evaluator"
version = "0.1.0"
description = "Agentic RFP evaluation and supplier ranking"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "browser: real-browser Playwright tests (skip with -m \"not browser\")",
    "eval: LLM evaluation suite (replay by default)",
    "live: calls the real OpenAI API; manual only",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # long fictional prose strings
"ui/*" = ["E501"]  # Streamlit layout calls read better on one line
"app.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["core"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "core.tools.document_tool"
disallow_untyped_calls = false  # PyMuPDF ships without type hints

[[tool.mypy.overrides]]
module = "sentence_transformers"
ignore_missing_imports = true  # optional dependency (requirements-local.txt)
