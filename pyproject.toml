[project]
name = "rfp-evaluator"
version = "0.1.0"
description = "Agentic RFP evaluation and supplier ranking"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "eval: LLM evaluation suite (replay by default)",
    "live: calls the real OpenAI API; manual only",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["core"]
plugins = ["pydantic.mypy"]
